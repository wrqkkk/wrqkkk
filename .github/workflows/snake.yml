name: generate profile assets

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate contribution graph and streak assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: wrqkkk
        run: python scripts/generate_profile_assets.py

      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: wrqkkk
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=purple
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23a78bfa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
